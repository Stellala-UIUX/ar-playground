<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR 收集遊戲</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  #hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: rgba(0,0,0,0.75); z-index: 10; }
  .hud-stat { color: #fff; font-size: 15px; font-weight: 500; }
  .hud-stat span { color: #ffd700; }
  #camBox { position: relative; flex: 1; overflow: hidden; background: #111; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #flash { position: absolute; inset: 0; background: rgba(255,215,0,0.3); pointer-events: none; opacity: 0; transition: opacity 0.4s; }
  #bottom { background: rgba(0,0,0,0.75); padding: 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #msgBox { color: #ccc; font-size: 14px; min-height: 20px; text-align: center; }
  #startBtn { padding: 10px 32px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  #startBtn:disabled { opacity: 0.6; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); z-index: 5; }
  #overlay h2 { color: #fff; font-size: 28px; margin-bottom: 8px; }
  #overlay .final { color: #ffd700; font-size: 22px; }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-stat">分數 <span id="score">0</span></div>
  <div class="hud-stat">時間 <span id="timer">30</span>s</div>
  <div class="hud-stat">畫面 <span id="left">0</span> 個</div>
</div>
<div id="camBox">
  <video id="vid" autoplay muted playsinline></video>
  <canvas id="cvs"></canvas>
  <div id="flash"></div>
  <div id="overlay" class="hidden">
    <h2>遊戲結束！</h2>
    <p class="final">最終分數：<span id="finalScore">0</span></p>
  </div>
</div>
<div id="bottom">
  <div id="msgBox">點擊「開始遊戲」並允許相機</div>
  <button id="startBtn">▶ 開始遊戲</button>
</div>

<script>
const vid = document.getElementById('vid');
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const leftEl = document.getElementById('left');
const msgBox = document.getElementById('msgBox');
const startBtn = document.getElementById('startBtn');
const flash = document.getElementById('flash');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');

const ITEMS = ['⭐','💎','🍎','🌸','🎁','🔮','🍀','🌙','🦋','🐉'];
const COLORS = ['#ffd700','#00cfff','#ff6b6b','#ff9ff3','#ffd700','#b388ff','#55efc4','#a8edea','#fd79a8','#e17055'];

let items = [], score = 0, timeLeft = 30, running = false, raf, countdown;

function resize() {
  cvs.width = cvs.offsetWidth;
  cvs.height = cvs.offsetHeight;
}

function spawnItem() {
  const idx = Math.floor(Math.random() * ITEMS.length);
  items.push({
    x: 44 + Math.random() * (cvs.width - 88),
    y: 44 + Math.random() * (cvs.height - 88),
    r: 26 + Math.random() * 18,
    emoji: ITEMS[idx],
    color: COLORS[idx],
    vx: (Math.random() - 0.5) * 1.4,
    vy: (Math.random() - 0.5) * 1.4,
    pulse: Math.random() * Math.PI * 2,
    caught: false,
    alpha: 1
  });
}

function draw() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  items.forEach(it => {
    if (it.caught) { it.alpha = Math.max(0, it.alpha - 0.1); }
    if (it.alpha <= 0) return;
    it.pulse += 0.05;
    const scale = 1 + Math.sin(it.pulse) * 0.08;
    const r = it.r * scale;
    if (!it.caught) {
      it.x += it.vx; it.y += it.vy;
      if (it.x < r) { it.x = r; it.vx *= -1; }
      if (it.x > cvs.width - r) { it.x = cvs.width - r; it.vx *= -1; }
      if (it.y < r) { it.y = r; it.vy *= -1; }
      if (it.y > cvs.height - r) { it.y = cvs.height - r; it.vy *= -1; }
    }
    ctx.save();
    ctx.globalAlpha = it.alpha;
    ctx.beginPath();
    ctx.arc(it.x, it.y, r + 6, 0, Math.PI * 2);
    ctx.fillStyle = it.color + '33';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(it.x, it.y, r, 0, Math.PI * 2);
    ctx.fillStyle = it.color + 'aa';
    ctx.fill();
    ctx.font = `${Math.round(r * 1.15)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.emoji, it.x, it.y + 2);
    ctx.restore();
  });
  items = items.filter(it => it.alpha > 0);
  leftEl.textContent = items.filter(it => !it.caught).length;
  if (running) raf = requestAnimationFrame(draw);
}

function doFlash() {
  flash.style.transition = 'none';
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.transition = 'opacity 0.5s'; flash.style.opacity = '0'; }, 30);
}

function getPos(e) {
  const rect = cvs.getBoundingClientRect();
  const sx = cvs.width / rect.width, sy = cvs.height / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
}

function onTap(e) {
  if (!running) return;
  e.preventDefault();
  const { x: tx, y: ty } = getPos(e);
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.caught) continue;
    if (Math.hypot(tx - it.x, ty - it.y) < it.r + 12) {
      it.caught = true;
      score++;
      scoreEl.textContent = score;
      msgBox.textContent = ['✨ 抓到了！','🎉 漂亮！','⚡ 好快！'][Math.floor(Math.random()*3)] + ' +1';
      doFlash();
      return;
    }
  }
  msgBox.textContent = '差一點！再試試…';
}

cvs.addEventListener('click', onTap);
cvs.addEventListener('touchstart', onTap, { passive: false });

async function startGame() {
  startBtn.disabled = true;
  startBtn.textContent = '相機啟動中…';
  overlay.classList.add('hidden');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
    });
    vid.srcObject = stream;
    await new Promise(r => { vid.onloadedmetadata = r; });
    await vid.play();
    resize();
    running = true;
    score = 0; timeLeft = 30;
    scoreEl.textContent = 0; timerEl.textContent = 30;
    items = [];
    for (let i = 0; i < 5; i++) spawnItem();
    raf = requestAnimationFrame(draw);
    msgBox.textContent = '點擊畫面中的物件來收集！';
    startBtn.style.display = 'none';
    countdown = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft > 0 && timeLeft % 6 === 0) spawnItem();
      if (timeLeft <= 0) endGame();
    }, 1000);
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = '▶ 開始遊戲';
    const reason = err.name === 'NotAllowedError' ? '請在瀏覽器設定裡允許相機權限，再重新整理頁面'
                 : err.name === 'NotFoundError' ? '找不到相機裝置'
                 : err.message;
    msgBox.textContent = '❌ ' + reason;
  }
}

function endGame() {
  running = false;
  clearInterval(countdown);
  cancelAnimationFrame(raf);
  finalScore.textContent = score;
  overlay.classList.remove('hidden');
  const msg = score >= 15 ? '🏆 超強！' : score >= 8 ? '👍 不錯！' : '💪 繼續練習！';
  msgBox.textContent = msg + ' 抓到 ' + score + ' 個';
  startBtn.textContent = '🔄 再玩一次';
  startBtn.style.display = 'block';
  startBtn.disabled = false;
  startBtn.onclick = () => {
    vid.srcObject?.getTracks().forEach(t => t.stop());
    startGame();
  };
}

startBtn.onclick = startGame;
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
